services:
  - type: web
    name: space-quest-nasa-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: NASA_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://rubenv123.github.io
